# CI/CD (M5) — tests + build + audits on every push/PR; on the `cloud` branch
# it also builds the arm64 image, pushes it to GHCR and bumps the GitOps tag.
#
# Deploys are PULL-based on purpose: the k3s API (6443) is NSG-allowlisted to
# the owner's IP, so CI *cannot* reach the cluster — instead ArgoCD (running
# inside the cluster) watches this repo and applies the bumped tag. CI's only
# "deploy" action is the values-oci.yaml commit.
name: ci

on:
  push:
    branches: [cloud, master]
    # A docs-only commit used to build a full arm64 image, push it to GHCR,
    # bump the GitOps tag and roll the pod. Measured on the node 2026-09-09:
    # SIX app images retained, containerd at 8.1G against 4.8G free on the
    # root volume, and two of those images came from documentation commits
    # made that same morning. Tests prove nothing about a markdown file, and
    # the rollout is pure churn on the one resource that is actually scarce.
    #
    # Skipping the RUN is what breaks the chain: no `image` job means no tag
    # bump, so ArgoCD syncs the commit, finds no manifest change and leaves
    # the pod alone. A commit touching BOTH docs and code still builds --
    # paths-ignore skips only when EVERY changed file matches.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend — ruff + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: install (locked, incl. dev)
        run: uv sync --frozen
      # Full ruff config now enforced (pyproject select E,F,I,B,UP,N,SIM). The
      # bug-catching rules (F pyflakes + B bugbear) plus import order (I),
      # pyupgrade (UP) and the sensible E/N/SIM checks all gate on every push;
      # the deliberate house-style exemptions (E501 long comments, N806 SQL/
      # matrix locals, E402 lazy imports, a few SIM readability rules, test-only
      # E701/E702…) live in pyproject `ignore` / per-file-ignores, documented there.
      - name: ruff (full config)
        run: uv run ruff check app tests
      # La suite gira UNA volta sotto coverage, e in cambio si puo' chiedere
      # quali funzioni non sono mai partite.
      #
      # ⚠️ Su tutti i core (`-n auto`, pytest-xdist) dal 2026-09-21: era il
      # passo piu' lungo del job, 168 s su un runner a quattro vCPU con la
      # suite in un processo solo. La copertura la raccoglie pytest-cov da ogni
      # worker e la unisce: verificato in locale che il rapporto del codice
      # mai eseguito qui sotto e' IDENTICO fra seriale e parallelo. Un test che
      # dipendeva da cio' che un altro aveva gia' fatto nello stesso processo
      # (il censimento degli istogrammi) e' stato reso autosufficiente prima
      # di accendere il parallelo — con `-n 4` saltava in silenzio.
      - name: pytest (suite con guardia di rete), sotto coverage, su tutti i core
        run: uv run pytest tests/ -q -n auto --cov=app --cov-report=json:.coverage.json

      # ⚠️ NON una percentuale di copertura: quella misura quante righe sono
      # state toccate e si Goodhart-izza al primo tentativo di alzarla. Questo
      # chiede una cosa sola — «questa funzione e' mai partita?» — e sorveglia
      # il DELTA, perche' l'arretrato esistente e' in buona parte legittimo.
      #
      # Il difetto che chiude: `_RANGE_PERIODS` era codice morto che AVVALORAVA
      # una nota sbagliata in CLAUDE.md, quindi chi andava a verificare lo
      # trovava e ci credeva. Il codice morto non sta fermo.
      - name: nessuna NUOVA funzione mai eseguita
        run: uv run python -m app.scripts.dead_code_report

  backend-postgres:
    name: backend — real-Postgres portability (M7)
    # Proves the migrated json_text() queries and the whole schema work on a REAL
    # Postgres, not merely that the SQL compiles.
    #
    # GATES THE DEPLOY since 2026-08-27. It used to sit off the image/bump
    # chain, on the grounds that "the cloud DB stays SQLite until the M7-P4
    # cutover, so this must not block the SQLite-safe deploy". That cutover has
    # happened — values-oci.yaml carries `postgres.enabled: true  # M7-P4: CUT
    # OVER` — so the rationale had inverted: production IS Postgres, and the
    # one lane that can catch a Postgres-only regression was the one allowed
    # not to matter. A query that works on SQLite and fails on Postgres (the
    # json_text() family is exactly this class) passed `backend`, shipped an
    # image, moved the tag and 500'd in production, while this job went red in
    # parallel — too late to stop it.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fa
          POSTGRES_PASSWORD: fa
          POSTGRES_DB: fa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # psycopg3 driver (added to runtime deps for the P4 cutover); the module is
      # skipped whenever this var is unset (every other job and all local runs).
      TEST_DATABASE_URL: postgresql+psycopg://fa:fa@localhost:5432/fa_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: install (locked, incl. dev)
        run: uv sync --frozen
      - name: pytest (real-Postgres lane)
        run: uv run pytest tests/test_postgres_integration.py -v

  frontend:
    name: frontend — hooks lint + vitest + tsc + vite build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # ONE eslint rule, and the reason it is worth its own step: a hook called
      # after an early return throws during render, and a render throw with no
      # boundary above it unmounts the whole app. `useIsPhone()` did exactly
      # that in RunProgressToast and blanked the dashboard whenever a scan
      # started. tsc and vite both accepted it happily.
      #
      # The full `npm run lint` is deliberately NOT used here: it reports ~57
      # pre-existing stylistic errors, so it would fail on day one and get
      # switched off. See frontend/eslint.hooks.config.js.
      - name: hook rules (blank-screen class)
        run: npm run lint:hooks
      # The suite existed and passed, but nothing ran it on a push — so a test
      # could go red and merge anyway. ~3s for 87 tests; there is no reason for
      # it not to gate.
      - name: vitest
        run: npm run test:run
      - run: npm run build

  ui-gate:
    name: gate UI — layout e accessibilità in un browser vero (${{ matrix.parte }})
    runs-on: ubuntu-latest
    # ⚠️ DIVISO PER VIEWPORT, su macchine diverse, e non con piu' worker sulla
    # stessa. Il gate gira con `workers: 1` di proposito — «un gate che
    # fallisce a intermittenza viene disattivato: meglio lento», dice
    # playwright.config.ts — e quattro browser contro un backend solo su
    # quattro vCPU sono esattamente la contesa che quella scelta evita. Qui
    # ogni parte ha il SUO backend, il suo seme e un worker: stessa misura di
    # prima, un terzo del tempo. Misurato il 2026-09-21: 143 s di test in
    # serie, di cui desktop ~80, mobile ~33, tablet ~30.
    #
    # Per PROGETTO, e il desktop — che da solo pesava ~80 s — in DUE meta' su
    # un filtro, non su un elenco di file. `--grep` di Playwright confronta
    # anche il percorso del file, quindi «a11y.spec» da una parte e tutto il
    # resto dall'altra: verificato in locale 15 + 16 = 31 test, nessuno perso
    # ne' doppio. ⚠️ E' un `--grep-invert`, non una lista, di proposito: un
    # file di specifica NUOVO cade da solo nella seconda meta'. Con una lista
    # resterebbe fuori dal desktop finche' qualcuno non se ne ricorda.
    #
    # Il raccolto della linea di base a11y resta in una macchina sola, perche'
    # le misure che lo riempiono girano solo nella prima meta'.
    strategy:
      fail-fast: false
      matrix:
        include:
          - parte: desktop · accessibilità
            argomenti: --project=desktop --grep a11y\.spec
          - parte: desktop · layout
            argomenti: --project=desktop --project=over-fhd --grep-invert a11y\.spec
          - parte: mobile
            argomenti: --project=mobile
          - parte: tablet
            argomenti: --project=tablet
    # ⚠️ Questo job esiste perché jsdom NON FA LAYOUT. L'11 settembre 2026 la
    # suite vitest era verde su 590 test e OTTO rotte traboccavano su un
    # telefono, in produzione: `getBoundingClientRect` restituisce zeri in
    # jsdom, quindi nessun test di quella suite poteva vederlo. Lo stesso vale
    # per contrasto, dimensione dei bersagli e visibilità del focus — CLAUDE.md
    # lo registra già per axe. Qui gli stili sono calcolati davvero.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: install (lockfile)
        working-directory: frontend
        run: npm ci
      - name: build (il bundle VERO, servito da FastAPI come in produzione)
        working-directory: frontend
        run: npm run build

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: install backend
        working-directory: backend
        run: uv sync --frozen

      # ⚠️ IL SEME NON È FACOLTATIVO. In CI il database nasce vuoto, e una
      # pagina senza righe non può traboccare: il gate sarebbe verde per
      # costruzione. È la forma «un test può essere vero di niente» che
      # CLAUDE.md registra quattro volte. I pavimenti di contenuto in
      # `e2e/fixtures.ts` falliscono se questo passo smette di funzionare,
      # quindi il silenzio non è un esito possibile.
      # ⚠️ FA-074 — IL BACKEND DEL GATE NON HA RETE, di proposito.
      #
      # Il gate misurava anche cio' che yfinance restituiva quel giorno. All'avvio
      # lo scan di recupero scaricava barre VERE per i ticker del seme (ticker
      # reali) e le incollava sopra la storia sintetica: su /stocks l'RSI di
      # 0016.HK scendeva a 18,8 e accendeva una violazione di contrasto solo
      # quando la rete rispondeva, e su /alerts la corsa delle 00:01 UTC ha
      # letto `button-name: 46 -> 49` — verde tredici minuti prima, su un commit
      # che toccava solo le migrazioni.
      #
      # Il proxy punta a una porta chiusa: ogni chiamata esterna fallisce subito
      # e sempre allo stesso modo, invece di riuscire a volte. NO_PROXY lascia
      # passare il traffico verso l'app stessa. `--no-sync` perche' uv non provi
      # a raggiungere l'indice dietro lo stesso proxy.
      - name: schema + seme deterministico (senza rete)
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./data/e2e.db
          SECRET_KEY: ${{ steps.chiave.outputs.valore }}
          HTTPS_PROXY: http://127.0.0.1:9
          HTTP_PROXY: http://127.0.0.1:9
          NO_PROXY: 127.0.0.1,localhost
        run: |
          # ⚠️ Le minuscole si esportano QUI e non nella mappa `env`: GitHub
          # tratta i nomi delle variabili senza distinzione di maiuscole e
          # rifiuta `HTTPS_PROXY` e `https_proxy` insieme come un duplicato — il
          # workflow non parte affatto, con zero job. Ma libcurl (yfinance) legge
          # SOLO `http_proxy` minuscolo, quindi servono entrambe le forme.
          export https_proxy="$HTTPS_PROXY" http_proxy="$HTTP_PROXY" no_proxy="$NO_PROXY"
          mkdir -p data
          uv run --no-sync python -c "from app.core.db import engine, Base; import app.models; Base.metadata.create_all(engine)"
          uv run --no-sync python -m app.scripts.seed_e2e

      # ⚠️ Chiave USA-E-GETTA, generata nel job e mai persistita: firma solo
      # il cookie di questa esecuzione, su un database seminato che vive
      # quanto il runner. Non e' un segreto da proteggere e non deve finire
      # nei Secrets del repo — metterlo li' creerebbe una chiave di lunga vita
      # dove ne basta una di novanta secondi.
      - name: chiave di sessione effimera
        id: chiave
        run: |
          K=$(openssl rand -hex 32)
          echo "::add-mask::$K"
          echo "valore=$K" >> "$GITHUB_OUTPUT"

      - name: avvia l'app come la serve la produzione (senza rete)
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./data/e2e.db
          SECRET_KEY: ${{ steps.chiave.outputs.valore }}
          # Il seme ha gia' eseguito la valutazione sulle proprie barre; il
          # recupero all'avvio si spegne comunque in modo esplicito, cosi' la
          # garanzia non dipende dall'orario di un `ScanRun`.
          SCAN_STARTUP_STALE_HOURS: "0"
          HTTPS_PROXY: http://127.0.0.1:9
          HTTP_PROXY: http://127.0.0.1:9
          NO_PROXY: 127.0.0.1,localhost
        run: |
          export https_proxy="$HTTPS_PROXY" http_proxy="$HTTP_PROXY" no_proxy="$NO_PROXY"
          nohup uv run --no-sync uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/uvicorn.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/api/health >/dev/null && exit 0
            sleep 1
          done
          echo "::error::il backend non è salito"; cat /tmp/uvicorn.log; exit 1

      # Il token è firmato dall'app stessa e vive solo nell'ambiente del passo.
      # ⚠️ Non passa da un file servito: la ricetta di riproduzione locale in
      # CLAUDE.md scrive una pagina in `public/`, che è una directory
      # VERSIONATA e va cancellata a mano ogni volta.
      - name: sessione
        id: sess
        working-directory: backend
        env:
          SECRET_KEY: ${{ steps.chiave.outputs.valore }}
        run: |
          TOK=$(uv run python -c "from app.core.security import create_session_token; from app.core.config import settings; print(f'{settings.session_cookie_name}={create_session_token(settings.admin_username)}')")
          echo "::add-mask::$TOK"
          echo "cookie=$TOK" >> "$GITHUB_OUTPUT"

      # ⚠️ Solo la «headless shell»: senza `channel` nella configurazione,
      # Playwright in headless lancia quella, e il Chromium completo che
      # `install chromium` scaricava accanto (~5 s) non girava mai.
      #
      # In cache i BINARI, non le dipendenze di sistema: i font arrivano da
      # apt a ogni corsa, e devono — la larghezza del testo decide il layout
      # che questo gate misura, e un font diverso sposterebbe ogni conteggio.
      # La chiave e' il lockfile, cioe' la versione di Playwright.
      - uses: actions/cache@v4
        id: browser-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-shell-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - name: browser
        working-directory: frontend
        run: |
          if [ "${{ steps.browser-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps --only-shell chromium
          fi

      - name: gate
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:8000
          E2E_SESSION_COOKIE: ${{ steps.sess.outputs.cookie }}
        run: npx playwright test ${{ matrix.argomenti }}

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          # Un nome per parte: upload-artifact v4 rifiuta due artefatti con lo
          # stesso nome nella stessa run.
          name: playwright-report-${{ strategy.job-index }}
          path: frontend/test-results/
          retention-days: 7

  audit:
    name: dependency audit (fails on a known CVE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      # NOT continue-on-error any more. It used to be, and that is exactly why
      # 18 known CVEs (6 in starlette, the ASGI layer under FastAPI) sat in the
      # lockfile unnoticed: the job printed them and went green. An audit that
      # can never fail is decorative.
      #
      # ⚠️ E questo job GATTA il rilascio: `gitops` porta
      # `needs: [image, audit, image-scan]`. Questa nota diceva il contrario —
      # «does NOT gate deploys, `image` needs [backend, frontend]» — ed era
      # rimasta indietro rispetto alla riga che l'ha cambiato. Un commento
      # sbagliato accanto al codice giusto e' credibile proprio perche' sta
      # li': una nuova advisory su un transitivo ferma il rilascio, e chi legge
      # solo qui conclude che sia passato.
      - name: pip-audit (backend runtime deps)
        working-directory: backend
        run: |
          uv export --frozen --no-dev --format requirements-txt -o requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # `npm audit --audit-level=high` cannot say "read it, does not apply
      # here", so one unfixable advisory pins this red forever — and a
      # permanently red pipeline is an ignored one. It already cost us: a
      # genuinely broken backend gate went unnoticed among the usual red.
      # The gate below audits the PRODUCTION tree only (the build toolchain
      # never ships) and fails on anything not carrying a written reason and
      # a review date in security/audit-allowlist.json.
      - name: npm audit gate (production tree, reviewed exceptions)
        working-directory: frontend
        run: |
          npm audit --json --omit=dev > /tmp/npm-audit.json || true
          node security/audit-gate.mjs /tmp/npm-audit.json

  image:
    name: arm64 image → GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/cloud'
    # ⚠️ NESSUN `needs`: l'immagine si costruisce e si scansiona MENTRE girano
    # i test, e ad aspettarli e' il RILASCIO (`bump`), non la build. Fino al
    # 2026-09-21 questo job aspettava tutti e quattro i job di test, cioe' il
    # piu' lento dei quattro (~4 min) si sommava a build + scansione (~3 min).
    #
    # Il cancello non si e' spostato di un millimetro: un bundle che sborda o
    # che aggiunge violazioni di accessibilita' non viene RILASCIATO, perche'
    # `bump` ha tutti i test in `needs`. Si pubblica solo col tag dello SHA —
    # un'immagine di un commit rosso esiste nel registro e non la usa nessuno,
    # esattamente come prima succedeva a un'immagine bocciata da trivy.
    # `latest` invece si sposta solo DOPO il bump (job `latest`): un tag che
    # si legge come «l'ultima buona» non puo' puntare a una non verificata.
    #
    # ⚠️ Su arm64 NATIVO dal 2026-09-21: il nodo e' un A1, e fino a qui ogni
    # istruzione dello stadio runtime girava EMULATA da QEMU su un runner
    # x64. Misurato: la sola prova degli import 60 s, il vecchio `chown -R`
    # 20 s. In regime quei livelli stanno in cache, ma la prima build del
    # giorno rifa' le patch di sicurezza e tutto cio' che le segue, ed era
    # quella che tornava sul percorso critico. I runner arm64 sono gratuiti
    # per i repository pubblici. Lo stadio frontend usa `$BUILDPLATFORM`,
    # che qui diventa arm64: il lockfile porta gia' i binari arm64-musl di
    # rolldown e lightningcss, verificato prima di spostarlo.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # La data e' l'unico ingresso che fa ri-eseguire `apt-get upgrade` nel
      # Dockerfile. Senza, `cache-from: type=gha` riusa quel livello per
      # sempre e le patch di sicurezza non vengono MAI riscaricate: e' come
      # il 12 settembre trivy ha trovato 12 CVE gia' corrette a monte. Il
      # commento esteso sta accanto all'ARG nel Dockerfile.
      # Granularita' giornaliera: una build lenta al giorno, non una a push.
      - id: apt
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          # Stamped into the image so /api/platform/health can report which
          # commit is actually running - see the ARG in the Dockerfile.
          build-args: |
            GIT_SHA=${{ github.sha }}
            APT_SECURITY_DATE=${{ steps.apt.outputs.date }}
          tags: |
            ghcr.io/milomitic/finance-alert:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # ── Il gate anti-cache ──────────────────────────────────────────────
      # ⚠️ Questo passo esiste perche' il livello delle patch di sicurezza e'
      # rimasto INERTE per 24 giorni senza che niente lo dicesse: buildkit ne
      # riusava la cache e la pipeline restava verde finche' trivy non ha
      # trovato 12 CVE gia' corrette a monte.
      #
      # Asserisce sull'ARTEFATTO, non sul log. Leggere `CACHED` dall'output di
      # buildkit dipenderebbe dal suo formato e si romperebbe in silenzio a un
      # aggiornamento dell'action; il file e' scritto dentro lo STESSO `RUN`
      # delle patch, quindi se la data e' di oggi le patch sono state
      # scaricate oggi. Non c'e' modo di avere l'una senza le altre.
      #
      # Nativo sul runner arm64: e' un `cat`, il costo e' trascurabile e
      # l'immagine e' quella VERA appena pubblicata.
      - name: le patch di sicurezza devono essere di oggi
        run: |
          set -euo pipefail
          ATTESA='${{ steps.apt.outputs.date }}'
          LETTO=$(docker run --rm --platform linux/arm64             ghcr.io/milomitic/finance-alert:${{ github.sha }}             cat /etc/image-provenance.json)
          echo "provenienza letta dall'immagine: $LETTO"
          if ! printf '%s' "$LETTO" | grep -q "\"apt_security_date\":\"$ATTESA\""; then
            echo "::error::Il livello apt non e' stato eseguito: atteso $ATTESA."             "Buildkit ha riusato la cache — vedi la sezione sulla trappola in CLAUDE.md."
            exit 1
          fi

  image-scan:
    name: trivy image scan (fails on FIXABLE critical/high)
    if: github.event_name == 'push' && github.ref == 'refs/heads/cloud'
    needs: image
    runs-on: ubuntu-latest
    steps:
      # A real gate, and since 2026-09-09 it is ON the bump chain: `bump` needs
      # this job and `audit`, so a fixable CRITICAL/HIGH stops the promotion
      # instead of shipping beside a red X.
      #
      # This REVERSES what the note here used to say — "deliberately OFF the
      # bump chain, so a scan finding does not block a release" — and the
      # reason it said that is worth keeping in view: a gate that blocks
      # constantly gets switched off. `--ignore-unfixed` is what makes it
      # safe to block, and it is the crux:
      # base-image OS CVEs with no upstream fix yet would otherwise red the
      # pipeline forever, which trains everyone to ignore it (exactly how the
      # pip/npm audit rotted). We only fail on things we can actually act on.
      - name: trivy
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ghcr.io/milomitic/finance-alert:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  bump:
    name: gitops — bump image tag
    if: github.event_name == 'push' && github.ref == 'refs/heads/cloud'
    # The image is BUILT and pushed regardless (publishing before the scan is
    # fine); what waits for the gates is the PROMOTION. Until 2026-09-09 this
    # was `needs: image` alone, so a failing `audit` or `image-scan` turned CI
    # red and the GitOps tag advanced anyway — the deploy went out beside its
    # own failure notice, which is how a red X stops being read.
    #
    # Both gates only fail on things that can actually be acted on: `audit` on
    # a known CVE with a fix, `image-scan` with --ignore-unfixed. A genuine
    # emergency ships by removing a dependency here in a commit, which leaves
    # the deroga in the git history where it can be reviewed, rather than in
    # someone's memory.
    #
    # ⚠️ Dal 2026-09-21 porta ANCHE i test: `image` non li aspetta piu' (si
    # costruisce in parallelo), quindi e' qui che il rilascio li attende tutti.
    # Toglierne uno da questa lista vorrebbe dire rilasciare senza di esso.
    needs: [backend, backend-postgres, frontend, ui-gate, audit, image, image-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloud
          fetch-depth: 0
      - name: point values-oci.yaml at the new image
        run: |
          sed -i 's/^  tag: .*/  tag: "${{ github.sha }}"/' charts/finance-alert/values-oci.yaml
          if git diff --quiet; then
            echo "tag already current — nothing to bump"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add charts/finance-alert/values-oci.yaml
          git commit -m "chore(cd): image ${{ github.sha }} [skip ci]"
          # Robust push: HEAD:cloud (checkout leaves a detached HEAD), and retry
          # — a transient GitHub "remote: fatal error in commit_refs" rejected
          # this step twice, and a concurrent push would need a rebase.
          for i in 1 2 3 4 5; do
            if git push origin HEAD:cloud; then exit 0; fi
            echo "push attempt $i failed — refetch/rebase and retry"
            git fetch origin cloud && git rebase origin/cloud || true
            sleep $((i * 5))
          done
          echo "::error::bump push failed after 5 attempts"; exit 1

  latest:
    name: ghcr — latest sull'immagine rilasciata
    if: github.event_name == 'push' && github.ref == 'refs/heads/cloud'
    # Dopo il bump, fuori dal percorso critico: niente dipende da `latest` nel
    # chart (che punta allo SHA), ma chi scarica l'immagine a mano deve
    # trovare l'ultima RILASCIATA, non l'ultima costruita. Il ri-etichettamento
    # copia il manifesto nel registro, senza scaricare ne' ricostruire nulla.
    needs: bump
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: latest -> ${{ github.sha }}
        run: |
          docker buildx imagetools create \
            -t ghcr.io/milomitic/finance-alert:latest \
            ghcr.io/milomitic/finance-alert:${{ github.sha }}
