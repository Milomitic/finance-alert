# Barman Cloud Plugin object store. The configuration directly translates the
# former Cluster.spec.backup.barmanObjectStore block so existing OCI backup
# history remains readable during migration.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: pg-backups
  namespace: finance-alert
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/part-of: finance-alert
spec:
  configuration:
    destinationPath: s3://finance-alert-backups/
    endpointURL: https://axaqdeicu0wx.compat.objectstorage.eu-milan-1.oraclecloud.com
    s3Credentials:
      accessKeyId:
        name: pg-wal-s3
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: pg-wal-s3
        key: SECRET_ACCESS_KEY
    wal:
      compression: gzip
    data:
      compression: gzip
  retentionPolicy: "30d"
  instanceSidecarConfiguration:
    # OCI S3 compatibility requires non-streaming checksums. These variables
    # follow the Barman sidecar from the former Cluster-level environment.
    env:
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required
