# CloudNativePG Cluster — the finance-alert Postgres (M7-P2).
#
# Single instance: HA needs >=2 nodes; the free-tier has one A1 VM, so a
# replica would just co-locate and buy nothing. Durability comes from the PVC
# (block volume) + WAL archiving to Object Storage (added in the P2 WAL step).
#
# Sizing is deliberately small for the shared 12 GB node (app + kube-prometheus
# + Loki already at ~46% live). shared_buffers stays at 128 MB instead of the
# textbook 25%-of-RAM precisely because the RAM is shared. The 768 Mi limit
# leaves headroom for the P3 bulk COPY (1M+ ohlcv rows) without OOM.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg
  namespace: finance-alert
  labels:
    app.kubernetes.io/part-of: finance-alert
spec:
  instances: 1
  # Without this CNPG exports nothing to Prometheus, and it exported nothing
  # for the whole life of this cluster: `count(cnpg_*)` returned ZERO on
  # 2026-08-27. The backups run and were restored end-to-end once (see
  # RUNBOOK-postgres-dr.md), but NOTHING was checking they were still
  # happening — the same shape as the OOMKill that went unnoticed for nine
  # days. The alert rules that consume this live in
  # infra/observability/app-alert-rules.yaml.
  # Metrics are scraped by the GitOps-managed PodMonitor in podmonitor.yaml.
  # PG16 (matches the CI test lane). arm64 variant verified on GHCR.
  imageName: ghcr.io/cloudnative-pg/postgresql:16
  primaryUpdateStrategy: unsupervised

  # OCI Object Storage's S3-compatible API rejects the AWS SDK's default
  # streaming/chunked payload signing + trailing checksums (boto3 >= 1.36):
  # "NotImplemented: AWS chunked encoding not supported". Force the SDK to
  # compute checksums only WHEN_REQUIRED so barman-cloud sends plain PUTs.
  env:
    - name: AWS_REQUEST_CHECKSUM_CALCULATION
      value: WHEN_REQUIRED
    - name: AWS_RESPONSE_CHECKSUM_VALIDATION
      value: WHEN_REQUIRED

  storage:
    size: 5Gi
    storageClass: local-path

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      # no cpu limit — let it burst on the 2-vCPU node; cap memory to protect
      # the co-tenant app + observability from a runaway query.
      memory: 768Mi

  postgresql:
    # Require TLS for every TCP client (M7-P5). CNPG's generated pg_hba ends with
    # a permissive `host all all all scram-sha-256`, which would also accept a
    # CLEARTEXT connection. User rules are inserted BEFORE that default, so
    # `hostnossl … reject` closes the plaintext path while `hostssl` keeps the
    # app working — verified beforehand that every app connection was already
    # TLSv1.3. Unix-socket (`local … peer`) rules are CNPG-fixed and unaffected,
    # so the in-pod instance manager + metrics exporter keep working.
    pg_hba:
      - hostssl all all all scram-sha-256
      - hostnossl all all all reject
    # pgaudit (M7-P5): a security audit trail that lands in the Postgres log ->
    # pod stdout -> Loki (M6) -> queryable in Grafana.
    shared_preload_libraries:
      - pgaudit
    parameters:
      # DELIBERATELY not 'write': the scan writes millions of ohlcv rows, so
      # auditing DML would flood the log and the (already 85%-full) node disk.
      # 'ddl' (schema changes) + 'role' (GRANT/REVOKE/CREATE ROLE) are rare and
      # high-signal — exactly what a security audit needs to catch.
      pgaudit.log: "ddl,role"
      pgaudit.log_catalog: "off"
      pgaudit.log_parameter: "on"
      shared_buffers: "128MB"
      max_connections: "50"      # app pool + migration + a spare; plenty
      work_mem: "8MB"
      maintenance_work_mem: "64MB"

  # Least-privilege bootstrap: create the app database owned by a NON-superuser
  # role (fa_app). CNPG keeps the postgres superuser password-less/no external
  # login by default (enableSuperuserAccess unset), so fa_app is the only
  # externally-reachable identity. CNPG auto-generates the Secret `pg-app`
  # (username/password/dbname/host/port/uri) that the app consumes at cutover.
  bootstrap:
    initdb:
      database: finance_alert
      owner: fa_app

  # Continuous WAL archiving is provided by the Barman Cloud Plugin.
  # The ObjectStore carries the 30d retention policy.
  #
  # `enabled: true` is the operator's own default and is declared here on
  # purpose (FA-021). The CRD gives this list no `x-kubernetes-list-type`, so
  # it is ATOMIC: server-side apply cannot merge it entry by entry the way it
  # merges `postgresql.parameters`, where the operator injects 23 extra keys
  # and ArgoCD correctly ignores them because it owns only its own seven. One
  # extra key inside a list element makes the WHOLE list differ, which is why
  # `Cluster/pg` sat permanently OutOfSync with an empty `argocd app diff`.
  #
  # Declaring the field is the fix rather than an `ignoreDifferences` on
  # `/spec/plugins`: that would silence a genuine change to the archiver
  # configuration too, and an ignored diff is a worse outcome than a noisy one.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: pg-backups
