# Loki (single binary, filesystem) + promtail (log shipper), sized for the
# shared A1 VM. Grafana/Prometheus come from kube-prometheus-stack, so both are
# disabled here — Loki is wired into the existing Grafana as a datasource (M6-4).
#
# Install:
#   helm repo add grafana https://grafana.github.io/helm-charts
#   helm upgrade --install loki grafana/loki-stack -n monitoring -f this-file
loki:
  enabled: true
  persistence:
    enabled: true
    storageClassName: local-path
    size: 2Gi
  # FA-104 (2026-09-26). 300Mi was OOMKilled by a multi-day aggregation. The
  # limit alone was not the defect — see `chunk_cache_config` below — but a
  # querying Loki needs headroom above its 60Mi idle. The node has ~5GiB free.
  resources:
    requests: { cpu: 20m, memory: 128Mi }
    limits: { memory: 768Mi }
  config:
    # ⚠️ THE cause of the OOM. Loki 2.6.1 enables an in-process FIFO cache for
    # chunks by default, capped at 1GB — inside a container capped at 300Mi.
    # A query over several days fetches enough chunks to fill it, and the
    # kernel kills the process long before the cache's own cap is reached.
    # Read from the running pod's /config on 2026-09-26; nothing in this file
    # had ever set it. Bounded, not disabled: repeated queries still hit it.
    chunk_store_config:
      chunk_cache_config:
        fifocache:
          max_size_bytes: 128MB
    # Fewer sub-queries in flight: each holds chunk iterators in memory. The
    # defaults (10 per querier, 32 per query) are sized for a cluster of
    # queriers, not one pod sharing a node with Postgres and Prometheus.
    querier:
      max_concurrent: 4
    # Compactor-driven retention so the 2Gi PVC can't fill up: keep 72h of logs.
    compactor:
      retention_enabled: true
      compaction_interval: 10m
      retention_delete_delay: 1h
    limits_config:
      # 72h -> 720h (2026-08-20), same reason as the Prometheus retention:
      # a two-week absence outlived the logs. Costs almost nothing — measured,
      # 72h of ALL namespaces was 30.5MB, so 30 days is ~305MB inside the 2Gi
      # PVC below. The old 72h was not a disk constraint, just a default nobody
      # had had a reason to revisit.
      retention_period: 720h
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      max_query_parallelism: 8
      # A week per query (default 30d1h). Thirty days stay retained and any
      # week of them stays queryable; what fails is one query spanning all of
      # them, and it now fails with an error instead of killing Loki. For
      # longer windows read the app's own log files or a counter (CLAUDE.md,
      # «Loki regge poche ore»).
      max_query_length: 7d1h

promtail:
  enabled: true
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }
  config:
    snippets:
      # Dropped at the SHIPPER, so the line never reaches Loki and never costs
      # retention. Measured over 7 days: kube-system produced 40,724 error/warn
      # lines and every single one was this pair of CoreDNS warnings about
      # optional custom-config files that are not meant to exist — ~5,800 a
      # day, 40% of everything the cluster logs, carrying no information.
      #
      # `scripts/diagnose.py` already muted this string when READING, which is
      # what hid how much of it was being written.
      #
      # `cri` MUST stay first and must not be dropped: it parses the container
      # runtime envelope, and replacing the stage list without it would stop
      # every log in the cluster from being parsed at all.
      pipelineStages:
        - cri: {}
        - drop:
            expression: ".*No files matching import glob pattern.*"
            drop_counter_reason: coredns_optional_config

# We already have these from kube-prometheus-stack.
grafana:
  enabled: false
prometheus:
  enabled: false
