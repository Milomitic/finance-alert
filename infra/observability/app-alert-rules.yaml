# Alert rules for the finance-alert app.
#
# WHY THIS FILE EXISTS
# --------------------
# On ~10 August 2026 the app container was OOMKilled. It restarted itself and
# kept working, and nobody was told — the owner found out nine days later by
# asking. Auditing the cluster afterwards, the alert rules with live series
# were exactly two: `Watchdog` (the heartbeat that always fires by design) and
# `TargetDown`. Nothing watched memory, restarts, or the app being down.
#
# Alertmanager already routes every non-Watchdog alert to the Telegram
# receiver, so these need no routing of their own — they only had to exist.
#
# Prometheus discovers PrometheusRule objects from every namespace
# (`ruleSelectorNilUsesHelmValues: false` in kube-prometheus-stack.values.yaml),
# so this applies with a plain `kubectl apply -f` like the PodMonitor beside it.
#
# ALIVE vs WORKING
# ----------------
# The first four rules watch whether the app is ALIVE. A pod that stays up
# while every scan fails would keep all of them silent — the more insidious
# outage, because nothing crashes and the dashboards look fine while the data
# quietly stops moving. `FinanceAlertNotScanning` closes that, using a gauge
# the app exports itself (`app/core/app_metrics.py`); Prometheus rules cannot
# query Loki, where the scan log lines live, so the app has to say so.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: finance-alert-app
  namespace: monitoring
  labels:
    release: kps
spec:
  groups:
    - name: finance-alert.rules
      rules:
        # --- The one that would have prevented the incident ------------------
        # Memory here is a SAWTOOTH, not a plateau: ~950-1040 MB at rest,
        # ~1760 MB during the scan + recompute cycle. A rule of the usual shape
        # (`ratio > 0.85` sustained `for: 10m`) would therefore never fire —
        # the peak lasts minutes, and between cycles the ratio is back to a
        # comfortable-looking 0.3.
        #
        # So the ratio is taken against the HIGH-WATER MARK of the last half
        # hour rather than the instantaneous value. `for: 0m` is deliberate:
        # max_over_time already provides the smoothing, and requiring the peak
        # to also persist would re-introduce the very blindness being fixed.
        - alert: FinanceAlertMemoryNearLimit
          expr: |
            max by (pod) (
              max_over_time(
                container_memory_working_set_bytes{namespace="finance-alert",container="app"}[30m]
              )
            )
            /
            max by (pod) (
              kube_pod_container_resource_limits{namespace="finance-alert",container="app",resource="memory"}
            )
            > 0.85
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "finance-alert vicina al limite di memoria"
            description: >-
              Nell'ultima mezz'ora il picco di memoria ha superato l'85% del
              limite ({{ $value | humanizePercentage }} su {{ $labels.pod }}).
              È lo stato che precede un OOMKill. Il picco arriva dal ciclo
              scan + recompute; controlla se il limite va alzato o il ciclo
              alleggerito.

        # --- After the fact, but it names the cause --------------------------
        # `last_terminated_reason` stays set for the life of the pod, so on its
        # own it would alert forever after a single kill. Gating it on a restart
        # in the last hour makes it fire once per event and resolve by itself.
        - alert: FinanceAlertOOMKilled
          expr: |
            (
              increase(kube_pod_container_status_restarts_total{namespace="finance-alert",container="app"}[1h]) > 0
            )
            and on (pod, container)
            (
              kube_pod_container_status_last_terminated_reason{namespace="finance-alert",container="app",reason="OOMKilled"} == 1
            )
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "finance-alert uccisa per memoria (OOMKilled)"
            description: >-
              Il container {{ $labels.pod }} è stato terminato dal kernel per
              superamento del limite di memoria ed è ripartito. I dati in
              corso di elaborazione in quel momento sono persi.

        # --- Any restart, whatever the reason --------------------------------
        # Broader than the OOM rule on purpose: a crash loop from a bad deploy
        # or a failed migration looks nothing like an OOM and is just as silent.
        - alert: FinanceAlertRestarted
          expr: |
            increase(kube_pod_container_status_restarts_total{namespace="finance-alert",container="app"}[1h]) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "finance-alert è ripartita"
            description: >-
              {{ $value | printf "%.0f" }} riavvii dell'app nell'ultima ora
              ({{ $labels.pod }}). Se è accompagnato da FinanceAlertOOMKilled
              la causa è la memoria; altrimenti guarda i log del container
              precedente.

        # --- Alive but not working -------------------------------------------
        # `scan_alerts` runs DAILY (day_of_week="*"), with an extra weekday
        # tick after the EU close, so the largest normal gap is 24h — on a
        # weekend, when only the daily job fires. 26h gives two hours of slack
        # over the guaranteed cadence: long enough never to cry about a late
        # start, short enough to notice a missed day the same morning.
        #
        # The gauge is REHYDRATED from `scan_runs` at boot. Without that a
        # restart would zero it and this rule would fire falsely — including
        # right after the OOM restart the rules above exist to catch, turning
        # one real incident into two alerts, one of them wrong.
        #
        # SCOPED TO kind="alerts_scan", and it has to be. The gauge also
        # carries kind="score_recompute", which looked 1,345 hours stale the
        # first time this was checked against production — and that is CORRECT
        # behaviour, not an outage: `run_tracked_recompute` is only ever
        # called by the "Ricalcola score" button (trigger="manual"), it has no
        # cron, and the automatic recompute runs INSIDE run_tracked_scan under
        # the scan's own row. So its staleness measures how long since someone
        # last clicked a button, which is not a fault condition.
        #
        # Left unscoped, `max by (kind)` would have made this alert fire
        # permanently from the moment it was applied. Do not broaden it back
        # without giving score_recompute a schedule of its own.
        - alert: FinanceAlertNotScanning
          expr: |
            (
              time() - max by (kind) (
                finance_alert_last_successful_run_timestamp_seconds{kind="alerts_scan"}
              )
            ) > 26 * 3600
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: "finance-alert è viva ma non completa più i job ({{ $labels.kind }})"
            description: >-
              L'ultimo run '{{ $labels.kind }}' andato a buon fine risale a più
              di 26 ore fa. Il pod risponde — questo non è un crash: o il job
              non parte, o fallisce ogni volta. Guarda i log dello scheduler.

        # The gauge missing ENTIRELY is a different failure from a stale one:
        # a series that never appears cannot be compared against time(), so the
        # rule above would stay silent forever. Split out because it usually
        # means the app failed to hydrate at boot, not that scanning stopped.
        - alert: FinanceAlertScanMetricMissing
          expr: |
            absent(finance_alert_last_successful_run_timestamp_seconds{kind="alerts_scan"})
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "la metrica di ultimo scan non esiste"
            description: >-
              L'app non espone finance_alert_last_successful_run_timestamp_seconds.
              O il boot non ha reidratato la gauge da scan_runs, o nessun run è
              mai riuscito. Finché manca, FinanceAlertNotScanning è cieca.

        # --- The data stopped moving while everything reported success -------
        # The rules above, including FinanceAlertNotScanning, all watch whether
        # WORK HAPPENS. None of them can see whether the work achieved
        # anything. Measured on 2026-08-26: SATS, NUVL, CPRX and EA carried no
        # new price bar for 16 to 40 days while every scan completed, every
        # dashboard was green and no alert existed that could have said so.
        #
        # Alerting on "any stale stock" would fire forever: genuinely delisted
        # symbols sit in this count until someone removes them from the
        # catalogue, and there were nine of them the day this was written. So
        # the rule watches the count GROWING past its own recent floor, which
        # is the shape a real incident takes — roughly twenty NYSE Arca ETFs
        # froze together on 17 July 2026 when one bad ticker aborted a
        # Postgres transaction and took the rest of its batch with it.
        - alert: FinanceAlertStaleDataSpike
          expr: |
            (
              finance_alert_stale_ohlcv_stocks
              - min_over_time(finance_alert_stale_ohlcv_stocks[7d])
            ) > 5
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "più titoli del solito hanno prezzi fermi"
            description: >-
              I titoli senza barre recenti sono cresciuti di
              {{ $value | printf "%.0f" }} rispetto al minimo dell'ultima
              settimana. Gli scan possono completare con successo mentre i
              dati non avanzano: controlla i log del fetch OHLCV per un ticker
              che aborta la transazione e trascina con sé il resto del blocco.

        # The catastrophic shape, which the spike rule can miss if the floor
        # rises with it: a large absolute count means the pipeline is broken
        # rather than a few symbols having died.
        - alert: FinanceAlertStaleDataHigh
          expr: |
            finance_alert_stale_ohlcv_stocks > 50
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: "molti titoli senza prezzi recenti"
            description: >-
              {{ $value | printf "%.0f" }} titoli non hanno una barra degli
              ultimi giorni. Su un universo di circa mille nomi questo non è
              un delisting, è la pipeline dei prezzi che non sta scrivendo.

        # --- The app stopped answering the scrape ----------------------------
        # `absent()` is the other half: `up == 0` needs the target to exist to
        # be zero, so a target that disappears entirely produces no series and
        # no alert. Both halves are needed to distinguish "down" from "gone".
        - alert: FinanceAlertDown
          expr: |
            up{job="monitoring/finance-alert-app"} == 0
            or
            absent(up{job="monitoring/finance-alert-app"})
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "finance-alert non risponde allo scrape"
            description: >-
              Da 5 minuti /metrics non risponde: l'app è giù, oppure il
              PodMonitor non la trova più.
