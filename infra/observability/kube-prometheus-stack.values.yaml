# kube-prometheus-stack (Prometheus + Grafana + Alertmanager + node-exporter +
# kube-state-metrics), sized for a SHARED Always-Free A1 VM (2 OCPU / 12 GB)
# that already runs the app + ArgoCD. Everything is deliberately small: short
# retention, modest limits, 60s scrape.
#
# Install:
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   helm upgrade --install kps prometheus-community/kube-prometheus-stack \
#     -n monitoring --create-namespace -f this-file \
#     --set grafana.adminPassword=<random>
fullnameOverride: kps

# k3s bundles the control plane into one process and does NOT expose these as
# scrape targets → disable their ServiceMonitors so we don't get permanently
# "down" targets cluttering the alerts.
kubeControllerManager: { enabled: false }
kubeScheduler: { enabled: false }
kubeProxy: { enabled: false }
kubeEtcd: { enabled: false }

# Control-plane histogram BUCKETS are dropped at scrape (2026-08-20). Measured
# on the live TSDB, ten bucket families were 52,832 of 96,950 active series —
# 54% of everything stored — led by apiserver_request_duration_seconds_bucket
# (12,954) and etcd_request_duration_seconds_bucket (10,064). They exist to
# compute apiserver latency quantiles, which nobody is ever going to tune on a
# single-node personal cluster; meanwhile they were halving how far back the
# metrics that ARE read could go.
#
# `_count` and `_sum` survive, so average latency is still available — only the
# quantiles are gone. Some of the chart's default control-plane SLO rules
# reference these buckets and will simply evaluate to no data, staying inactive
# rather than erroring, which is what they already were on this cluster.
#
# BOTH scrape jobs need the rule, and finding that out cost a wrong first
# attempt. k3s runs the apiserver, etcd and controller-manager inside ONE
# process, so its kubelet endpoint serves their metrics alongside its own —
# `count by (job) (apiserver_request_duration_seconds_bucket)` showed
# job=kubelet, not job=apiserver. Dropping them only on kubeApiServer changed
# nothing; dropping them only on the kubelet left 3,860 series still arriving
# from the real apiserver target. Measured after applying both: the three
# families go to zero and ingestion falls from 1,753 to 905 samples/s, −48%.
#
# The kubelet rule is on the MAIN /metrics endpoint only. The chart gives
# cadvisor its own endpoint (and its own `cAdvisorMetricRelabelings`), which is
# left alone deliberately: container_memory_working_set_bytes lives there and
# is the input to the memory alert in app-alert-rules.yaml. Cardinality is not
# the only thing worth counting.
kubeApiServer:
  serviceMonitor:
    metricRelabelings:
      - action: drop
        sourceLabels: [__name__]
        regex: "(apiserver|etcd|workqueue)_.*_bucket"

kubelet:
  serviceMonitor:
    metricRelabelings:
      - action: drop
        sourceLabels: [__name__]
        regex: "(apiserver|etcd|workqueue)_.*_bucket"

prometheusOperator:
  resources:
    requests: { cpu: 20m, memory: 96Mi }
    limits: { memory: 256Mi }

prometheus:
  prometheusSpec:
    # 3d -> 30d (2026-08-20). The owner came back from two weeks away and the
    # stack could not say what had happened: the app had been OOMKilled around
    # 10 August and the only evidence left was Kubernetes' cumulative restart
    # counter. Metrics went back 3 days, logs 3.
    #
    # `retentionSize` is the real cap here, not the time — measured, 3 days of
    # this cluster cost 0.67GB, so 2500MB buys roughly two and a half weeks and
    # the 30d is just a generous ceiling above it. Sized against the PVC below
    # (3Gi) with room for the WAL, NOT against free disk: local-path does not
    # enforce the PVC request, so an over-large cap would quietly eat the
    # node's remaining 7.8GB and take everything down with it.
    retention: 30d
    retentionSize: "2500MB"
    scrapeInterval: 60s
    evaluationInterval: 60s
    resources:
      requests: { cpu: 100m, memory: 320Mi }
      limits: { memory: 900Mi }
    # Discover ServiceMonitors/PodMonitors from ALL namespaces (incl. the app's
    # in finance-alert), not just ones carrying this release's label.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: [ReadWriteOnce]
          resources: { requests: { storage: 3Gi } }

alertmanager:
  alertmanagerSpec:
    retention: 48h
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 96Mi }
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: [ReadWriteOnce]
          resources: { requests: { storage: 1Gi } }

grafana:
  # adminPassword injected at install via --set (kept out of git).
  defaultDashboardsTimezone: browser
  # Loki datasource is NOT added here: loki-stack ships its own labelled
  # ConfigMap that Grafana's sidecar auto-loads. Adding it here too created a
  # duplicate "Loki" that made provisioning skip both.
  # 192Mi → 512Mi (2026-08-03), in two steps and the second one matters more
  # than the first.
  #
  # 192 held at idle and collapsed the moment the UI was touched: Grafana went
  # 503 ("no available server" from Traefik — a real route with no healthy
  # backend) right after the admin UI was opened. Raised to 384 on the strength
  # of typical Grafana-11 figures. It then died AGAIN, on the login page alone.
  #
  # That second failure is the informative one. Dying under a dashboard load
  # would mean the ceiling was somewhat low; dying on login means it was below
  # the cost of merely existing, and that my 384 was an estimate dressed as a
  # measurement. 512 is still an estimate — `kubectl top pod` against a real
  # session is what turns it into a number, and this should be set from that.
  #
  # The asymmetry justifies erring high: the node is 2 OCPU / 12 GB at ~46%, so
  # 512Mi is ~4% of RAM and costs nothing, while being wrong the other way
  # takes the whole observability stack down — which is precisely when it is
  # needed.
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }

  # The chart ships readiness with timeoutSeconds: 1. Grafana's /api/health
  # touches its SQLite store, so one second is a bar it clears only on a good
  # day — the pod logged 78 readiness failures over 17 days. Each failure pulls
  # it out of the Service endpoints, and Traefik then answers 503 "no available
  # server" for a container that is running perfectly well.
  #
  # Exactly the failure the app hit earlier the same day: a health endpoint
  # that occasionally takes longer than a default probe allows. Same remedy,
  # 5s and a little more tolerance before declaring death.
  readinessProbe:
    httpGet: { path: /api/health, port: 3000 }
    timeoutSeconds: 5
    failureThreshold: 5
    periodSeconds: 10
  persistence:
    enabled: true
    storageClassName: local-path
    size: 1Gi
  # M4: HTTPS on a real hostname. Two earlier notes here were WRONG and had to go:
  #  1. "the ISP's RPZ blocks nip.io/sslip.io" — an nslookup suffix-search
  #     artifact, not a block. 80-225-80-141.sslip.io resolves to the VM fine.
  #  2. "port 80 is NSG-allowlisted" — NO LONGER TRUE. :80 is now open to the
  #     whole internet so Let's Encrypt can fetch the ACME challenge, which
  #     briefly left this path-based Grafana PUBLICLY reachable. Hence the
  #     websecure-only annotations below: Grafana must be served exclusively on
  #     :443, which IS still allowlisted. Never serve anything but ACME on :80.
  # serve_from_sub_path keeps Grafana under /grafana; Traefik prefers the longer
  # path prefix, so /grafana reaches Grafana and / still reaches the app.
  # ⚠️ MUST track `serve_from_sub_path` below. Grafana serves EVERYTHING under
  # root_url, /metrics included, so with the sub-path on it lives at
  # /grafana/metrics and the chart default (/metrics) returns 404. Prometheus
  # scraped the default and the kps-grafana target was DOWN — silently, since
  # the pod is 1/1 Running and Grafana itself works fine; only its own metrics
  # (dashboard latency, datasource errors, alerting, sessions) were missing.
  # Found 2026-09-04 via a firing TargetDown; verified /metrics 404 vs
  # /grafana/metrics 200 from inside the container.
  serviceMonitor:
    enabled: true
    path: /grafana/metrics

  "grafana.ini":
    server:
      domain: 80-225-80-141.sslip.io
      root_url: "%(protocol)s://%(domain)s/grafana"
      serve_from_sub_path: true
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      # :443 only — :443 stays NSG-allowlisted to the owner's IP, :80 does not.
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
    path: /grafana
    pathType: Prefix
    hosts:
      - 80-225-80-141.sslip.io
    tls:
      - hosts:
          - 80-225-80-141.sslip.io
        secretName: grafana-tls
  # Loki datasource is provisioned via a labeled ConfigMap (loki-datasource.*).

prometheus-node-exporter:
  resources:
    requests: { cpu: 10m, memory: 24Mi }
    limits: { memory: 64Mi }

kube-state-metrics:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }
