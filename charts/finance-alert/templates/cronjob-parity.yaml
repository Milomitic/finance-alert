{{- if .Values.parityCheck.enabled }}
{{- /*
  Il cluster che verifica SE STESSO.

  ⚠️ Esiste perche' «CI verde» e «ArgoCD Synced/Healthy» non rispondono alla
  domanda che conta dopo un rilascio: il bump del tag immagine e' un commit
  SUCCESSIVO a quello del codice — CI puo' scriverlo solo dopo aver costruito
  l'immagine — quindi esiste sempre una finestra in cui ogni semaforo e' verde
  e il pod esegue l'immagine precedente. Finora quella finestra si chiudeva da
  sola in ~3 minuti e nessuno se ne accorgeva; quando NON si chiude (immagine
  non scaricabile, rollout bloccato, ArgoCD fermo) non se ne accorge nessuno
  lo stesso, ed e' il caso che conta.

  ⚠️ Perche' DENTRO il cluster e non in CI: ArgoCD e' pull-based e CI non
  raggiunge il nodo — e' la postura giusta, documentata in GITOPS.md, e non va
  invertita per comodita' di un controllo. Il confronto lo fa quindi chi i due
  valori li ha gia' entrambi sotto mano.

  Confronta il tag DESIDERATO (quello dello StatefulSet, che ArgoCD tiene
  allineato al repo) con quello EFFETTIVAMENTE in esecuzione sul pod. Se
  divergono oltre la soglia di tolleranza, lo dice su Telegram — lo stesso
  canale che gia' consegna digest e allarmi di salute, misurato a 306 invii con
  zero fallimenti.

  ⚠️ Sola lettura sul cluster: `get` su pod e statefulset, niente altro. Il
  ServiceAccount non puo' modificare nulla.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "finance-alert.fullname" . }}-parity
  labels:
    {{- include "finance-alert.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "finance-alert.fullname" . }}-parity
  labels:
    {{- include "finance-alert.labels" . | nindent 4 }}
rules:
  # Solo lettura, solo due risorse, solo in questo namespace.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "finance-alert.fullname" . }}-parity
  labels:
    {{- include "finance-alert.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "finance-alert.fullname" . }}-parity
subjects:
  - kind: ServiceAccount
    name: {{ include "finance-alert.fullname" . }}-parity
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "finance-alert.fullname" . }}-parity
  labels:
    {{- include "finance-alert.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.parityCheck.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            {{- include "finance-alert.labels" . | nindent 12 }}
        spec:
          serviceAccountName: {{ include "finance-alert.fullname" . }}-parity
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
          containers:
            - name: parity
              # kubectl "nudo": l'immagine dell'app non lo contiene, e
              # aggiungerlo la' significherebbe mettere un client del cluster
              # dentro il processo esposto su internet.
              image: {{ .Values.parityCheck.image | quote }}
              imagePullPolicy: IfNotPresent
              resources:
                requests: { cpu: "10m", memory: "32Mi" }
                limits: { cpu: "100m", memory: "64Mi" }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              # ⚠️ kubectl scrive una cache sotto $HOME e il filesystem radice e'
              # in sola lettura: senza questi due, ogni invocazione fallisce.
              env:
                - name: HOME
                  value: /tmp
                - name: NAMESPACE
                  valueFrom:
                    fieldRef: { fieldPath: metadata.namespace }
                - name: STS
                  value: {{ include "finance-alert.fullname" . | quote }}
                - name: TOLLERANZA_MIN
                  value: {{ .Values.parityCheck.toleranceMinutes | quote }}
                - name: TELEGRAM_BOT_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "finance-alert.secretName" . }}
                      key: TELEGRAM_BOT_TOKEN
                      optional: true
                - name: TELEGRAM_CHAT_ID
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "finance-alert.secretName" . }}
                      key: TELEGRAM_CHAT_ID
                      optional: true
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -u
                  DESIDERATO=$(kubectl get statefulset "$STS" -n "$NAMESPACE" \
                    -o jsonpath='{.spec.template.spec.containers[0].image}')
                  # ⚠️ IL POD SI NOMINA, NON SI CERCA PER ETICHETTA.
                  #
                  # Questa sonda leggeva
                  #   kubectl get pod -l app.kubernetes.io/name=finance-alert
                  #     -o jsonpath='{.items[0]...}'
                  # e quell'etichetta ce l'ha OGNI pod del chart — compresi i
                  # Job che il chart stesso crea: il drill di ripristino e i pod
                  # di QUESTA sonda. `.items[0]` prende il primo in ordine
                  # alfabetico, quindi un pod chiamato `drill-...` (d < f) vince
                  # su quello dell'applicazione.
                  #
                  # Successo davvero il 2026-09-13: un drill lanciato a mano ha
                  # lasciato un pod `Completed`, la sonda ha letto la SUA
                  # immagine (`alpine/k8s:1.31.3`) e ha concluso «il pod non
                  # esegue l'immagine desiderata da 409 min» — l'eta' del pod
                  # del drill, non dell'app — mandando un avviso Telegram ogni
                  # quindici minuti mentre l'applicazione era sana. ArgoCD ha
                  # riportato `Degraded` per tutto il tempo, il che MASCHERA un
                  # degrado vero: un presidio che non puo' dire «tutto bene»
                  # non sta sorvegliando niente.
                  #
                  # Il nome di un pod di StatefulSet e' `<sts>-<ordinale>` per
                  # definizione: non e' una ricerca, e' un indirizzo, e nessun
                  # Job puo' chiamarsi cosi'.
                  POD="$STS-0"
                  IN_ESECUZIONE=$(kubectl get pod "$POD" -n "$NAMESPACE" \
                    -o jsonpath='{.status.containerStatuses[0].image}' 2>/dev/null || true)
                  PRONTO=$(kubectl get pod "$POD" -n "$NAMESPACE" \
                    -o jsonpath='{.status.containerStatuses[0].ready}' 2>/dev/null || true)
                  echo "pod:           $POD"
                  echo "desiderato:    $DESIDERATO"
                  echo "in esecuzione: $IN_ESECUZIONE"
                  echo "pronto:        $PRONTO"

                  # ⚠️ Una lettura VUOTA non e' «uguale a niente»: e' la sonda
                  # che non sa rispondere. Senza questo, due stringhe vuote si
                  # confrontano uguali e il presidio dichiara PARITA' OK mentre
                  # il pod non esiste — di nuovo una risposta pulita e falsa.
                  if [ -z "$DESIDERATO" ] || [ -z "$IN_ESECUZIONE" ]; then
                    echo "LETTURA VUOTA: statefulset o pod $POD non leggibili."
                    DESIDERATO="${DESIDERATO:-<assente>}"
                    IN_ESECUZIONE="${IN_ESECUZIONE:-<assente-o-pod-mancante>}"
                  fi

                  # ⚠️ La divergenza da sola NON e' un guasto: subito dopo un
                  # bump e' la finestra normale del GitOps, e allarmare li'
                  # insegnerebbe a ignorare l'allarme. Conta solo se DURA — si
                  # guarda da quanto il pod e' avviato.
                  AVVIO=$(kubectl get pod "$POD" -n "$NAMESPACE" \
                    -o jsonpath='{.status.startTime}' 2>/dev/null || true)
                  # ⚠️ `date -d "<ISO>"` NON esiste in BusyBox: serve `-D` col
                  # formato d'ingresso. Verificato dentro l'immagine prima di
                  # scriverlo qui — la prima stesura usava la sintassi GNU e
                  # avrebbe calcolato un'eta' vuota, quindi zero, quindi
                  # «dentro la finestra di rollout» per sempre: un allarme che
                  # non suona mai.
                  ORA=$(date -u +%s)
                  NATO=$(date -u -D "%Y-%m-%dT%H:%M:%SZ" -d "$AVVIO" +%s 2>/dev/null || echo "$ORA")
                  ETA_MIN=$(( (ORA - NATO) / 60 ))
                  echo "pod avviato da: ${ETA_MIN} min"

                  if [ "$DESIDERATO" = "$IN_ESECUZIONE" ] && [ "$PRONTO" = "true" ]; then
                    echo "PARITA' OK"
                    exit 0
                  fi
                  if [ "$ETA_MIN" -lt "$TOLLERANZA_MIN" ]; then
                    echo "divergenza dentro la finestra di rollout (${ETA_MIN} < ${TOLLERANZA_MIN} min): non allarmo"
                    exit 0
                  fi

                  MSG="Finance-Alert: il pod NON esegue l'immagine desiderata da ${ETA_MIN} min.
                  desiderato: ${DESIDERATO##*:}
                  in esecuzione: ${IN_ESECUZIONE##*:}
                  pronto: ${PRONTO}"
                  echo "$MSG"
                  if [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_CHAT_ID:-}" ]; then
                    wget -q -O- --post-data="chat_id=${TELEGRAM_CHAT_ID}&text=${MSG}" \
                      "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" >/dev/null \
                      && echo "avviso inviato" || echo "invio Telegram fallito"
                  else
                    echo "Telegram non configurato: l'avviso resta nei log del Job"
                  fi
                  # Esce 1 cosi' il Job risulta Failed e resta visibile in
                  # `kubectl get jobs` anche se Telegram non e' configurato.
                  exit 1
          volumes:
            - name: tmp
              emptyDir: {}
{{- end }}
