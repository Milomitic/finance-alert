{{- /*
Ingress — only rendered when ingress.enabled. On the k3s VM this is Traefik
(bundled with k3s, listening on the node's :80/:443), so the app is reachable
at http://<vm-public-ip>/. A real hostname + TLS (cert-manager) arrive in M4.
On the local kind cluster ingress stays disabled (default), unchanged from M2.
*/ -}}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "finance-alert.fullname" . }}
  labels:
    {{- include "finance-alert.labels" . | nindent 4 }}
  {{- if or .Values.ingress.annotations .Values.ingress.rateLimit.enabled }}
  annotations:
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if .Values.ingress.rateLimit.enabled }}
    # Traefik addresses a Middleware CRD as <namespace>-<name>@kubernetescrd.
    # Built here rather than hand-written in values so the reference cannot
    # drift from the object.
    #
    # What a dangling reference actually does, observed on 2026-09-09 in the
    # window between ArgoCD applying this annotation and creating the object:
    # Traefik logs `ERR error="middleware ... does not exist"` and SERVES THE
    # REQUEST ANYWAY, unlimited. So the error is real but it is only in the
    # log, and until the infra log panel existed nobody was reading it. A typo
    # here costs a rate limit that silently is not there.
    traefik.ingress.kubernetes.io/router.middlewares: {{ printf "%s-%s-ratelimit@kubernetescrd" .Release.Namespace (include "finance-alert.fullname" .) }}
    {{- end }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    - http:
        paths:
          - path: {{ .Values.ingress.path | default "/" | quote }}
            pathType: {{ .Values.ingress.pathType | default "Prefix" }}
            backend:
              service:
                name: {{ include "finance-alert.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
      {{- if .Values.ingress.host }}
      host: {{ .Values.ingress.host | quote }}
      {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
